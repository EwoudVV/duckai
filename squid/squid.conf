# Squid allowlist egress for duckai jobs. Every request logged with user/job.
http_port 3128
access_log /var/log/squid/access.log squid
logformat duckai %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %un %{User-Agent}>h
access_log /var/log/squid/access.log duckai

acl allowed dstdomain github.com api.github.com raw.githubusercontent.com
acl allowed dstdomain pypi.org files.pythonhosted.org
acl allowed dstdomain huggingface.co cdn-lfs.huggingface.co cdn-lfs.hf.co
acl allowed dstdomain ubuntu.com archive.ubuntu.com security.ubuntu.com
acl allowed dstdomain python.org docs.python.org
acl CONNECT method CONNECT
acl SMTP port 25 465 587
acl SafePorts port 80 443

http_access deny SMTP
http_access allow allowed
http_access allow localhost
http_access deny all
